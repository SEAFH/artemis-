<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrangWebCuat - Get Key</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 50%, #1a365d 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 15% 15%, rgba(100, 100, 150, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 70% 80%, rgba(120, 100, 180, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 40% 60%, rgba(150, 120, 200, 0.08) 0%, transparent 20%),
                radial-gradient(circle at 85% 25%, rgba(100, 150, 200, 0.08) 0%, transparent 20%),
                radial-gradient(circle at 25% 75%, rgba(180, 120, 200, 0.06) 0%, transparent 20%);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        
        .glass-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 1;
        }
        
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.1), transparent);
            transition: left 0.5s;
        }
        
        .glass-card:hover::before {
            left: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            background-size: 200% 200%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .btn-primary:hover::before {
            left: 100%;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.35);
            background-position: 100% 100%;
        }
        
        .spinner {
            border: 3px solid rgba(99, 102, 241, 0.3);
            border-top-color: #6366f1;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .header-icon {
            animation: icon-float 3s ease-in-out infinite;
        }
        
        @keyframes icon-float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }
        
        .code-display {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(30, 41, 59, 0.9));
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            border: 1px solid rgba(99, 102, 241, 0.4);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body class="text-white">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-2xl">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 mb-4 header-icon">
                    <i class="fas fa-code text-2xl"></i>
                </div>
                <h1 class="text-4xl font-bold mb-2 bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
                    TrangWebCuat
                </h1>
                <p class="text-gray-400">Get your key and script</p>
            </div>
            
            <!-- Get Key Section -->
            <div class="glass-card rounded-xl p-6 text-center mb-6" id="key-section">
                <div class="mb-4">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-500/20 mb-4">
                        <i class="fas fa-key text-3xl text-indigo-400"></i>
                    </div>
                    <h2 class="text-2xl font-bold mb-2">Get Your Key</h2>
                    <p class="text-gray-400 text-sm">Click to generate your access key</p>
                </div>
                <button onclick="generateKey()" class="btn-primary w-full py-4 rounded-xl text-lg font-semibold" id="btn-generate">
                    <i class="fas fa-key mr-2"></i> Get Key
                </button>
                <div class="mt-4 hidden" id="key-display">
                    <div class="code-display rounded-lg p-4">
                        <span id="key-value" class="text-xl text-indigo-400"></span>
                    </div>
                    <button onclick="copyKey()" class="btn-primary px-8 py-3 rounded-xl font-semibold mt-4">
                        <i class="fas fa-copy mr-2"></i> Copy Key
                    </button>
                    <p id="copy-feedback" class="text-green-400 text-sm mt-2 hidden">Key copied to clipboard!</p>
                </div>
            </div>
            
            <!-- Script Section -->
            <div class="glass-card rounded-xl p-6 text-center">
                <div class="mb-4">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-purple-500/20 mb-4">
                        <i class="fas fa-code text-3xl text-purple-400"></i>
                    </div>
                    <h2 class="text-2xl font-bold mb-2">Script</h2>
                    <p class="text-gray-400 text-sm">Copy the script to use</p>
                </div>
                <div class="code-display rounded-lg p-4 mb-4">
                    <pre id="script-content" class="text-sm text-purple-400 whitespace-pre-wrap">loadstring(game:HttpGet("https://getartemis.vercel.app"))()</pre>
                </div>
                <button onclick="copyScript()" class="btn-primary px-8 py-3 rounded-xl font-semibold">
                    <i class="fas fa-copy mr-2"></i> Copy Script
                </button>
                <p id="script-feedback" class="text-green-400 text-sm mt-2 hidden">Script copied to clipboard!</p>
            </div>
            
            <!-- Footer -->
            <div class="text-center mt-8 text-gray-500 text-sm">
                <p>TrangWebCuat - Secure Key System</p>
            </div>
        </div>
    </div>
    
    <script>
        let generatedKey = null;
        
        // Generate key - redirect to getkey web
        function generateKey() {
            window.location.href = 'checkpoint1.html';
        }
        
        // Generate random key
        function generateRandomKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let key = '';
            for (let i = 0; i < 24; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            const formattedKey = key.match(/.{1,8}/g).join('-');
            return 'KEY-SYSTEM-' + formattedKey;
        }
        
        // Copy key
        function copyKey() {
            navigator.clipboard.writeText(generatedKey);
            const feedback = document.getElementById('copy-feedback');
            feedback.classList.remove('hidden');
            setTimeout(() => feedback.classList.add('hidden'), 2000);
        }
        
        // Copy script
        function copyScript() {
            const scriptContent = document.getElementById('script-content').textContent;
            navigator.clipboard.writeText(scriptContent);
            const feedback = document.getElementById('script-feedback');
            feedback.classList.remove('hidden');
            setTimeout(() => feedback.classList.add('hidden'), 2000);
        }
    </script>
</body>
</html>
