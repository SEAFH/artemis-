<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artemis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 50%, #1a365d 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 15% 15%, rgba(100, 100, 150, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 70% 80%, rgba(120, 100, 180, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 40% 60%, rgba(150, 120, 200, 0.08) 0%, transparent 20%),
                radial-gradient(circle at 85% 25%, rgba(100, 150, 200, 0.08) 0%, transparent 20%),
                radial-gradient(circle at 25% 75%, rgba(180, 120, 200, 0.06) 0%, transparent 20%);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        
        .glass-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 1;
        }
        
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.1), transparent);
            transition: left 0.5s;
        }
        
        .glass-card:hover::before {
            left: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            background-size: 200% 200%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .btn-primary:hover::before {
            left: 100%;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.35);
            background-position: 100% 100%;
        }
        
        .spinner {
            border: 3px solid rgba(99, 102, 241, 0.3);
            border-top-color: #6366f1;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .key-display {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(30, 41, 59, 0.9));
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
            border: 1px solid rgba(99, 102, 241, 0.4);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.3);
        }
        
        .header-icon {
            animation: icon-float 3s ease-in-out infinite;
        }
        
        @keyframes icon-float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }
    </style>
</head>
<body class="text-white">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-2xl">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 mb-4 header-icon">
                    <i class="fas fa-key text-2xl"></i>
                </div>
                <h1 class="text-4xl font-bold mb-2 bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
                    Artemis
                </h1>
                <p class="text-gray-400">Complete the checkpoint to get your key</p>
            </div>
            
            <!-- Progress -->
            <div class="glass-card rounded-xl p-4 mb-6">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm text-gray-400">Progress</span>
                    <span class="text-sm font-semibold text-indigo-400">1/1</span>
                </div>
                <div class="h-2 bg-gray-700 rounded-full overflow-hidden">
                    <div class="h-full rounded-full transition-all duration-500" style="width: 100%; background: linear-gradient(90deg, #6366f1, #8b5cf6);"></div>
                </div>
            </div>
            
            <!-- Checkpoint Card -->
            <div class="glass-card rounded-xl p-6 text-center mb-6" id="checkpoint-section">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-indigo-500/20 mb-4">
                    <span class="font-bold text-4xl text-indigo-400">1</span>
                </div>
                <h2 class="text-2xl font-bold mb-2">Checkpoint</h2>
                <p class="text-gray-400 mb-6">Complete the checkpoint to get your key</p>
                <button onclick="completeCheckpoint()" class="btn-primary w-full py-4 rounded-xl text-lg font-semibold" id="btn-complete">
                    <i class="fas fa-play mr-2"></i> Start Checkpoint
                </button>
            </div>
            
            <!-- Generate Key Section (Hidden initially) -->
            <div class="glass-card rounded-xl p-6 text-center hidden" id="generate-section">
                <button onclick="generateKey()" class="btn-primary w-full py-4 rounded-xl text-lg font-semibold" id="btn-generate">
                    <i class="fas fa-key mr-2"></i> Generate Key
                </button>
            </div>
            
            <!-- Key Display (Hidden initially) -->
            <div class="glass-card rounded-xl p-6 text-center hidden" id="key-section">
                <div class="mb-4">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-500/20 mb-4">
                        <i class="fas fa-check text-3xl text-green-400"></i>
                    </div>
                    <h2 class="text-2xl font-bold mb-2">Your Key</h2>
                    <p class="text-gray-400 text-sm">Copy this key to access the system</p>
                </div>
                <div class="key-display rounded-lg p-4 mb-4">
                    <span id="key-value" class="text-xl text-indigo-400"></span>
                </div>
                <div class="mb-4">
                    <p class="text-sm text-gray-400">Key expires in:</p>
                    <p id="key-countdown" class="text-2xl font-bold text-indigo-400">24h 0m 0s</p>
                </div>
                <button onclick="copyKey()" class="btn-primary px-8 py-3 rounded-xl font-semibold">
                    <i class="fas fa-copy mr-2"></i> Copy Key
                </button>
                <p id="copy-feedback" class="text-green-400 text-sm mt-2 hidden">Copied to clipboard!</p>
            </div>
            
            <!-- Footer -->
            <div class="text-center mt-8 text-gray-500 text-sm">
                <p>Secure Checkpoint System</p>
            </div>
        </div>
    </div>
    
    <script>
        let clickCount = 0;
        const AD_LINK = 'https://www.profitablecpmratenetwork.com/t7b0wzj7y?key=a6e32a183811bebaefc27c7333cdb32d';
        let generatedKey = null;
        let keyGeneratedTime = null;
        let countdownInterval = null;
        
        // Open ad link (first 3 clicks always open ads, then no more ads)
        function maybeOpenAdLink() {
            clickCount++;
            
            // First 3 clicks always open ads (100% chance)
            if (clickCount <= 3) {
                setTimeout(() => {
                    window.open(AD_LINK, '_blank');
                }, 3000);
            }
            // After 3 clicks, no more ads
        }
        
        // Complete checkpoint
        async function completeCheckpoint() {
            const btn = document.getElementById('btn-complete');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '<div class="spinner w-5 h-5 rounded-full inline-block"></div> Loading...';
            btn.disabled = true;
            
            maybeOpenAdLink();
            
            await new Promise(resolve => setTimeout(resolve, 3000));
            
            // Redirect to loot-link.com
            window.location.href = 'https://loot-link.com/s?gRd7fbWO';
        }
        
        // Generate key
        async function generateKey() {
            const btn = document.getElementById('btn-generate');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '<div class="spinner w-5 h-5 rounded-full inline-block"></div> Generating...';
            btn.disabled = true;
            
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            generatedKey = generateRandomKey();
            document.getElementById('key-value').textContent = generatedKey;
            document.getElementById('generate-section').classList.add('hidden');
            document.getElementById('key-section').classList.remove('hidden');
            
            // Start countdown timer
            keyGeneratedTime = Date.now();
            startCountdown();
        }
        
        // Generate a random key
        function generateRandomKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let key = '';
            for (let i = 0; i < 24; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            const formattedKey = key.match(/.{1,8}/g).join('-');
            return 'KEY-SYSTEM-' + formattedKey;
        }
        
        // Start countdown timer
        function startCountdown() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            updateCountdown();
            countdownInterval = setInterval(updateCountdown, 1000);
        }
        
        // Update countdown display
        function updateCountdown() {
            if (!keyGeneratedTime) return;
            
            const now = Date.now();
            const elapsed = now - keyGeneratedTime;
            const remaining = (24 * 60 * 60 * 1000) - elapsed;
            
            if (remaining <= 0) {
                document.getElementById('key-countdown').textContent = 'EXPIRED';
                document.getElementById('key-countdown').classList.remove('text-indigo-400');
                document.getElementById('key-countdown').classList.add('text-red-400');
                if (countdownInterval) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                }
                return;
            }
            
            const hours = Math.floor(remaining / (60 * 60 * 1000));
            const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
            const seconds = Math.floor((remaining % (60 * 1000)) / 1000);
            
            document.getElementById('key-countdown').textContent = `${hours}h ${minutes}m ${seconds}s`;
        }
        
        // Copy key
        function copyKey() {
            navigator.clipboard.writeText(generatedKey);
            const feedback = document.getElementById('copy-feedback');
            feedback.classList.remove('hidden');
            setTimeout(() => feedback.classList.add('hidden'), 2000);
        }
    </script>
</body>
</html>
